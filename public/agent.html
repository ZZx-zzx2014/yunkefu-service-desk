<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>客服工作台 - 云客客服系统</title>
<link rel="stylesheet" href="/assets/base.css">
<style>
  /* ---------- 工作台三栏布局 ---------- */
  /*
   * 高度由父级 .main-area（100%）与 #view（flex:1; min-height:0）决定，
   * 绝不能再写死 100vh —— 固定视口高度会在侧栏内容撑开时把整块顶出可视区，
   * 导致底部被裁切且无法滚动。
   */
  .ws { display: grid; grid-template-columns: 306px 1fr 296px; height: 100%; min-height: 0; overflow: hidden; }
  @media (max-width: 1300px) { .ws { grid-template-columns: 280px 1fr; } .ws__right { display: none; } }
  @media (max-width: 900px) { .ws { grid-template-columns: 1fr; } .ws__list { display: none; } }

  /* grid 子项必须 min-height:0，否则内部 overflow-y:auto 不会生成滚动条 */
  .ws__list { border-right: 1px solid var(--border); display: flex; flex-direction: column; background: var(--surface); min-width: 0; min-height: 0; overflow: hidden; }
  .ws__main { display: flex; flex-direction: column; background: var(--surface-2); min-width: 0; min-height: 0; overflow: hidden; }
  .ws__right { border-left: 1px solid var(--border); background: var(--surface); overflow-y: auto; min-height: 0; overscroll-behavior: contain; }

  .list-head { padding: 12px 14px 10px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .list-tabs { display: flex; gap: 3px; margin-bottom: 10px; }
  .list-tab {
    flex: 1; text-align: center; padding: 7px 4px; border-radius: 7px; font-size: 12.5px;
    color: var(--text-2); cursor: pointer; transition: all .15s; position: relative;
  }
  .list-tab:hover { background: var(--bg-2); }
  .list-tab.is-active { background: var(--brand); color: #fff; font-weight: 600; }
  .list-tab__count {
    display: inline-block; min-width: 17px; height: 17px; line-height: 17px; padding: 0 4px;
    background: rgba(148,163,184,.28); border-radius: 99px; font-size: 10.5px; margin-left: 3px; font-weight: 600;
  }
  .list-tab.is-active .list-tab__count { background: rgba(255,255,255,.32); }
  .list-tab__count--alert { background: var(--danger); color: #fff; }

  .conv-list { flex: 1; overflow-y: auto; min-height: 0; overscroll-behavior: contain; }
  .conv-item {
    padding: 12px 14px; border-bottom: 1px solid var(--border); cursor: pointer;
    transition: background .14s; position: relative; border-left: 3px solid transparent;
  }
  .conv-item:hover { background: var(--brand-softer); }
  .conv-item.is-active { background: var(--brand-soft); border-left-color: var(--brand); }
  .conv-item__top { display: flex; align-items: center; gap: 9px; margin-bottom: 5px; }
  .conv-item__name { font-weight: 600; font-size: 13.5px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .conv-item__time { font-size: 11px; color: var(--text-3); flex-shrink: 0; }
  .conv-item__preview { font-size: 12.5px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-left: 37px; }
  .conv-item__tags { display: flex; gap: 5px; margin-top: 6px; padding-left: 37px; align-items: center; flex-wrap: wrap; }
  .conv-item__unread {
    position: absolute; right: 13px; bottom: 12px; background: var(--danger); color: #fff;
    min-width: 18px; height: 18px; border-radius: 99px; font-size: 10.5px; font-weight: 600;
    display: grid; place-items: center; padding: 0 5px;
  }

  .chat-head {
    padding: 12px 18px; background: var(--surface); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px; flex-shrink: 0;
  }
  .chat-head__title { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .chat-head__sub { font-size: 12px; color: var(--text-3); margin-top: 2px; display: flex; gap: 12px; }
  .chat-head__actions { margin-left: auto; display: flex; gap: 7px; }

  .chat-scroll { flex: 1; overflow-y: auto; padding: 20px 22px; min-height: 0; overscroll-behavior: contain; }
  .chat-foot-ws { background: var(--surface); border-top: 1px solid var(--border); padding: 10px 16px 12px; flex-shrink: 0; }

  .kb-suggest {
    background: var(--warning-soft); border: 1px solid #fde68a; border-radius: var(--radius);
    padding: 10px 13px; margin-bottom: 10px; font-size: 13px;
  }
  .kb-suggest__item { padding: 5px 0; cursor: pointer; color: #92400e; display: flex; gap: 7px; align-items: flex-start; }
  .kb-suggest__item:hover { text-decoration: underline; }

  .quick-panel {
    position: absolute; bottom: 100%; left: 16px; right: 16px; margin-bottom: 8px;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg); max-height: 320px; overflow-y: auto; z-index: 60;
  }
  .quick-panel__item { padding: 11px 14px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .quick-panel__item:hover { background: var(--brand-soft); }
  .quick-panel__title { font-size: 13px; font-weight: 600; display: flex; gap: 8px; align-items: center; }
  .quick-panel__content { font-size: 12.5px; color: var(--text-3); margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .side-section { border-bottom: 1px solid var(--border); }
  .side-section__head {
    padding: 11px 15px; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 7px;
    cursor: pointer; user-select: none; background: var(--surface-2);
  }
  .side-section__head:hover { background: var(--bg-2); }
  .side-section__body { padding: 13px 15px; }
  .side-section.is-collapsed .side-section__body { display: none; }
  .side-section__arrow { margin-left: auto; font-size: 10px; color: var(--text-3); transition: transform .2s; }
  .side-section.is-collapsed .side-section__arrow { transform: rotate(-90deg); }

  .info-row { display: flex; gap: 10px; font-size: 13px; margin-bottom: 9px; align-items: flex-start; }
  .info-row__label { color: var(--text-3); width: 62px; flex-shrink: 0; }
  .info-row__value { flex: 1; word-break: break-all; }

  .agent-status-picker { display: flex; gap: 5px; }
  .agent-status-picker__item {
    flex: 1; padding: 6px 4px; border-radius: 7px; border: 1px solid var(--border);
    font-size: 12px; text-align: center; cursor: pointer; transition: all .15s;
    display: flex; align-items: center; justify-content: center; gap: 4px;
  }
  .agent-status-picker__item:hover { border-color: var(--brand); }
  .agent-status-picker__item.is-active { border-color: var(--brand); background: var(--brand-soft); color: var(--brand); font-weight: 600; }

  .ws-empty { display: grid; place-items: center; height: 100%; text-align: center; padding: 40px; }

  .ticket-mini {
    border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px;
    margin-bottom: 9px; cursor: pointer; transition: all .15s; background: var(--surface);
  }
  .ticket-mini:hover { border-color: var(--brand); background: var(--brand-softer); }

  .note-item { border-left: 2px solid var(--border-2); padding: 0 0 10px 11px; margin-bottom: 4px; position: relative; }
  .note-item::before {
    content: ''; position: absolute; left: -4.5px; top: 5px; width: 7px; height: 7px;
    border-radius: 50%; background: var(--brand);
  }
</style>
</head>
<body>

<div class="app-layout">
  <!-- ==================== 侧边栏 ==================== -->
  <aside class="sidebar">
    <div class="sidebar__brand">
      <div class="sidebar__logo">🎧</div>
      <div>
        <div class="sidebar__title" id="siteName">客服工作台</div>
        <div class="sidebar__sub">YunKe Service Desk</div>
      </div>
    </div>
    <nav class="sidebar__nav" id="sidebarNav">
      <div class="sidebar__group">工作区</div>
      <a class="nav-item" data-route="/workspace" href="#/workspace">
        <span class="nav-item__icon">💬</span><span>在线会话</span>
        <span class="nav-item__badge hidden" id="badgeQueue">0</span>
      </a>
      <a class="nav-item" data-route="/tickets" href="#/tickets">
        <span class="nav-item__icon">🎫</span><span>我的工单</span>
        <span class="nav-item__badge hidden" id="badgeTickets">0</span>
      </a>
      <a class="nav-item" data-route="/customers" href="#/customers">
        <span class="nav-item__icon">👥</span><span>客户列表</span>
      </a>
      <div class="sidebar__group">支持</div>
      <a class="nav-item" data-route="/kb" href="#/kb">
        <span class="nav-item__icon">📚</span><span>知识库</span>
      </a>
      <a class="nav-item" data-route="/quick" href="#/quick">
        <span class="nav-item__icon">⚡</span><span>快捷话术</span>
      </a>
      <a class="nav-item" data-route="/stats" href="#/stats">
        <span class="nav-item__icon">📊</span><span>我的绩效</span>
      </a>
    </nav>
    <div class="sidebar__foot">
      <div class="flex items-center gap-10 mb-8">
        <div id="meAvatar"></div>
        <div class="flex-1" style="min-width:0">
          <div style="color:#fff;font-size:13px;font-weight:500" class="ellipsis" id="meName">-</div>
          <div style="font-size:11px;color:#64748b" class="ellipsis" id="meDept">-</div>
        </div>
      </div>
      <div class="panel" style="background:rgba(255,255,255,.05);border-radius:8px;padding:9px 10px">
        <div style="font-size:11px;color:#94a3b8;margin-bottom:7px">我的状态</div>
        <div class="agent-status-picker" id="statusPicker">
          <button class="agent-status-picker__item" data-status="online">● 在线</button>
          <button class="agent-status-picker__item" data-status="busy">● 忙碌</button>
          <button class="agent-status-picker__item" data-status="away">● 离开</button>
        </div>
      </div>
      <button class="btn btn--sm btn--block mt-8" style="background:rgba(255,255,255,.08);border-color:transparent;color:#cbd5e1" id="btnLogout">退出登录</button>
    </div>
  </aside>

  <!-- ==================== 主区域 ==================== -->
  <div class="main-area">
    <header class="topbar">
      <div>
        <div class="topbar__title" id="pageTitle">在线会话</div>
        <div class="topbar__desc" id="pageDesc">实时接待客户咨询</div>
      </div>
      <div class="topbar__right">
        <span class="badge badge--success" id="wsStatus"><span class="dot dot--online"></span>实时已连接</span>
        <button class="btn btn--sm btn--icon" id="btnNotif" title="通知" style="position:relative">
          🔔<span class="nav-item__badge" id="notifBadge" style="position:absolute;top:-6px;right:-6px;display:none">0</span>
        </button>
        <button class="btn btn--sm" id="btnRefresh">↻ 刷新</button>
      </div>
    </header>
    <div id="view" style="flex:1;min-height:0;display:flex;flex-direction:column"></div>
  </div>
</div>

<script src="/assets/common.js"></script>
<script src="/assets/agent.js"></script>
</body>
</html>
